<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17784A">
<title>Catatan Keuangan</title>
<style>
:root{--bg:#F4F6F3;--card:#FFFFFF;--ink:#1D2320;--muted:#56625B;--line:#DDE3DE;--in:#17784A;--out:#B3261E;--brand:#17784A;--on-brand:#FFFFFF;--field:#F4F6F3}
@media (prefers-color-scheme: dark){:root{--bg:#121513;--card:#1C201D;--ink:#EEF2EF;--muted:#A3AEA7;--line:#2E3530;--in:#5FD39A;--out:#FF8A80;--brand:#2E9A66;--on-brand:#06140D;--field:#121513}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:0 0 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.month{display:flex;align-items:center;gap:4px}
.month span{min-width:128px;text-align:center;font-weight:600;font-size:14px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.balance .label{color:var(--muted);font-size:13px}
.balance .value{font-size:32px;font-weight:700;letter-spacing:-0.5px;margin-top:2px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.two .card{margin:0}
.mini .label{color:var(--muted);font-size:12px}
.mini .value{font-size:17px;font-weight:700;margin-top:2px;word-break:break-word}
.in{color:var(--in)}
.out{color:var(--out)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.seg button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.field{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--field);padding:10px 12px}
.field:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
.save{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:12px;background:var(--brand);color:var(--on-brand);font-weight:700;cursor:pointer}
.msg{min-height:20px;margin:8px 0 0;font-size:13px;color:var(--out)}
.cat{margin-bottom:10px}
.cat .row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--out);border-radius:4px}
.day{font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.tx{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}
.tx .info{flex:1;min-width:0}
.tx .name{font-weight:600;font-size:15px}
.tx .note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tx .amt{font-weight:700;white-space:nowrap;font-size:15px}
.del{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.del.confirm{border-color:var(--out);color:var(--out);font-weight:700}
.empty{color:var(--muted);font-size:14px;margin:4px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Catatan Keuangan</h1>
    <div class="month">
      <button class="icon-btn" id="prev" type="button" aria-label="Bulan sebelumnya">&lsaquo;</button>
      <span id="monthLabel" aria-live="polite"></span>
      <button class="icon-btn" id="next" type="button" aria-label="Bulan berikutnya">&rsaquo;</button>
    </div>
  </div>

  <div class="card balance">
    <div class="label">Saldo total</div>
    <div class="value" id="balance">Rp 0</div>
  </div>
  <div class="two">
    <div class="card mini"><div class="label">Pemasukan bulan ini</div><div class="value in" id="sumIn">Rp 0</div></div>
    <div class="card mini"><div class="label">Pengeluaran bulan ini</div><div class="value out" id="sumOut">Rp 0</div></div>
  </div>

  <div class="card" id="form">
    <h2>Catat transaksi</h2>
    <p class="empty" id="storeNote" hidden>Penyimpanan tidak tersedia di tampilan ini, jadi data hilang saat halaman ditutup. Buka lewat browser atau aplikasi APK agar tersimpan.</p>
    <div class="seg" role="group" aria-label="Jenis transaksi">
      <button type="button" id="typeOut" aria-pressed="true">Pengeluaran</button>
      <button type="button" id="typeIn" aria-pressed="false">Pemasukan</button>
    </div>
    <label for="amount">Nominal (Rp)</label>
    <input class="field" id="amount" inputmode="numeric" autocomplete="off" placeholder="mis. 15.000">
    <label for="category">Kategori</label>
    <select class="field" id="category"></select>
    <label for="note">Catatan (opsional)</label>
    <input class="field" id="note" maxlength="80" autocomplete="off" placeholder="mis. es teh">
    <label for="date">Tanggal</label>
    <input class="field" id="date" type="date">
    <button class="save" type="button" id="saveBtn">Simpan</button>
    <p class="msg" id="msg" role="status"></p>
  </div>

  <div class="card">
    <h2>Pengeluaran per kategori</h2>
    <div id="cats"></div>
  </div>

  <div class="card">
    <h2>Riwayat</h2>
    <div id="list"></div>
  </div>
</div>

<script>
(function () {
  var KEY = 'catatan-keuangan-v1';
  var CATS = {
    out: ['Makan & Minum', 'Transportasi', 'Belanja', 'Tagihan', 'Hiburan', 'Kesehatan', 'Lainnya'],
    "in": ['Gaji', 'Bonus', 'Usaha', 'Lainnya']
  };
  var state = { type: 'out', tx: [], month: '' };
  var nf = new Intl.NumberFormat('id-ID');

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function rp(n) { return (n < 0 ? '-' : '') + 'Rp ' + nf.format(Math.abs(n)); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var a = JSON.parse(raw); if (Array.isArray(a)) state.tx = a; }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state.tx)); } catch (e) {} }

  function monthLabel(m) {
    var p = m.split('-');
    return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  }
  function shiftMonth(m, delta) {
    var p = m.split('-');
    var d = new Date(+p[0], +p[1] - 1 + delta, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }
  function dayLabel(s) {
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function fillCategories() {
    var sel = $('category');
    sel.textContent = '';
    CATS[state.type].forEach(function (c) {
      var o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    });
  }

  function setType(t) {
    state.type = t;
    $('typeOut').setAttribute('aria-pressed', String(t === 'out'));
    $('typeIn').setAttribute('aria-pressed', String(t === 'in'));
    fillCategories();
  }

  function render() {
    $('monthLabel').textContent = monthLabel(state.month);

    var total = 0, sumIn = 0, sumOut = 0;
    var monthTx = [];
    state.tx.forEach(function (t) {
      total += t.type === 'in' ? t.amount : -t.amount;
      if (t.date.slice(0, 7) === state.month) {
        monthTx.push(t);
        if (t.type === 'in') sumIn += t.amount; else sumOut += t.amount;
      }
    });
    var bal = $('balance');
    bal.textContent = rp(total);
    bal.className = 'value ' + (total < 0 ? 'out' : '');
    $('sumIn').textContent = rp(sumIn);
    $('sumOut').textContent = rp(sumOut);

    // Ringkasan per kategori
    var cats = $('cats');
    cats.textContent = '';
    var byCat = {};
    monthTx.forEach(function (t) { if (t.type === 'out') byCat[t.category] = (byCat[t.category] || 0) + t.amount; });
    var names = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });
    if (!names.length) {
      cats.appendChild(el('p', 'empty', 'Belum ada pengeluaran bulan ini.'));
    } else {
      names.forEach(function (n) {
        var box = el('div', 'cat');
        var row = el('div', 'row');
        row.appendChild(el('span', '', n));
        row.appendChild(el('span', '', rp(byCat[n])));
        var bar = el('div', 'bar');
        var fill = document.createElement('i');
        fill.style.width = Math.max(4, Math.round(byCat[n] / sumOut * 100)) + '%';
        bar.appendChild(fill);
        box.appendChild(row);
        box.appendChild(bar);
        cats.appendChild(box);
      });
    }

    // Riwayat
    var list = $('list');
    list.textContent = '';
    if (!monthTx.length) {
      list.appendChild(el('p', 'empty', 'Belum ada transaksi bulan ini.'));
      return;
    }
    monthTx.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id; });
    var lastDate = '';
    monthTx.forEach(function (t) {
      if (t.date !== lastDate) {
        list.appendChild(el('div', 'day', dayLabel(t.date)));
        lastDate = t.date;
      }
      var row = el('div', 'tx');
      var info = el('div', 'info');
      info.appendChild(el('div', 'name', t.category));
      if (t.note) info.appendChild(el('div', 'note', t.note));
      var amt = el('div', 'amt ' + (t.type === 'in' ? 'in' : 'out'), (t.type === 'in' ? '+' : '-') + rp(t.amount));
      var del = el('button', 'del', 'Hapus');
      del.type = 'button';
      del.setAttribute('aria-label', 'Hapus transaksi ' + t.category);
      var timer = null;
      del.addEventListener('click', function () {
        if (del.className.indexOf('confirm') === -1) {
          del.className = 'del confirm';
          del.textContent = 'Yakin?';
          timer = setTimeout(function () { del.className = 'del'; del.textContent = 'Hapus'; }, 3000);
        } else {
          clearTimeout(timer);
          state.tx = state.tx.filter(function (x) { return x.id !== t.id; });
          save();
          render();
        }
      });
      row.appendChild(info);
      row.appendChild(amt);
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  $('typeOut').addEventListener('click', function () { setType('out'); });
  $('typeIn').addEventListener('click', function () { setType('in'); });
  $('prev').addEventListener('click', function () { state.month = shiftMonth(state.month, -1); render(); });
  $('next').addEventListener('click', function () { state.month = shiftMonth(state.month, 1); render(); });

  $('amount').addEventListener('input', function () {
    var digits = this.value.replace(/\D/g, '').slice(0, 12);
    this.value = digits ? nf.format(+digits) : '';
  });

  function addTx() {
    var amount = parseInt($('amount').value.replace(/\D/g, ''), 10);
    var date = $('date').value;
    var msg = $('msg');
    if (!amount || amount < 1) { msg.textContent = 'Isi nominal lebih dari 0.'; return; }
    if (!date) { msg.textContent = 'Pilih tanggal.'; return; }
    state.tx.push({
      id: Date.now() * 1000 + Math.floor(Math.random() * 1000),
      type: state.type,
      amount: amount,
      category: $('category').value,
      note: $('note').value.trim(),
      date: date
    });
    save();
    msg.textContent = '';
    $('amount').value = '';
    $('note').value = '';
    state.month = date.slice(0, 7);
    msg.textContent = 'Tersimpan.';
    msg.style.color = 'var(--in)';
    setTimeout(function () { msg.textContent = ''; msg.style.color = ''; }, 2000);
    render();
  }

  $('saveBtn').addEventListener('click', addTx);
  ['amount', 'note'].forEach(function (id) {
    $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addTx(); } });
  });

  try { localStorage.setItem('__cek', '1'); localStorage.removeItem('__cek'); }
  catch (e) { $('storeNote').hidden = false; }

  load();
  state.month = todayStr().slice(0, 7);
  $('date').value = todayStr();
  setType('out');
  render();
})();
</script>
</body>
</html>
